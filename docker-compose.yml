services:
  blynky:
    # Pulled from GitHub's registry, built for amd64 and arm64 from each
    # release tag. BLYNKY_TAG in .env pins a release (0.4.0) or a minor line
    # (0.4); latest is the newest release, edge is main. To upgrade:
    #
    #   docker compose pull && docker compose up -d
    #
    # `docker compose build` builds it from this checkout instead, under the
    # same name, until the next pull replaces it.
    image: ghcr.io/gudlyf/blynky:${BLYNKY_TAG:-latest}
    build:
      # blinkpy is fetched during the build, so the context is just this repo.
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    # The container always listens on 8080; this is only where that gets
    # published. Loopback by default, to match the app's own HOST default —
    # the UI has no login unless AUTH_USER is set, so binding every host
    # interface has to be a deliberate act. Prefer tailscale serve against
    # this default; otherwise set BIND_ADDR to a tailnet IP, or 0.0.0.0, in
    # .env, and set AUTH_USER and AUTH_PASSWORD when you do.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8080}:8080"

    # Docker Desktop and OrbStack both define host.docker.internal already;
    # Docker Engine on Linux does not. Pinning it costs nothing where it is
    # already defined - under OrbStack host-gateway resolves to the same
    # address the name does - and makes the file work unchanged on Linux.
    #
    # Resolving the name is only half of it. Ollama binds loopback unless told
    # otherwise, and a container cannot reach that however the name resolves:
    # the symptom is "Connect call failed", a refusal rather than a DNS error.
    # Expose Ollama on the network (OLLAMA_HOST=0.0.0.0:11434, or the setting
    # of that name in Ollama.app), or point OLLAMA_URL at a LAN/tailnet
    # address it is actually listening on.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Optional, so this still comes up on a fresh clone that has no .env yet.
    env_file:
      - path: .env
        required: false

    # These win over anything in .env, which is the point: the checked-in
    # example sets HOST=127.0.0.1, and a container that binds loopback is
    # unreachable from the host.
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATA_DIR: /data
      CREDFILE: /data/.blink_creds.json

    # The Blink token lands in here as .blink_creds.json, alongside the clips
    # and stills, so a restart reuses the session instead of asking for the
    # 2FA code again. Bind-mounted rather than a named volume so the captures
    # stay browsable from the host; ./data is already gitignored.
    #
    # Nothing prunes this. The library keeps every clip and still ever
    # captured, so expect the host directory to grow without bound.
    volumes:
      - ./data:/data

    # Nothing in the image needs to change at runtime: everything Blynky
    # writes goes to /data, and ffmpeg's frames to /tmp. So the root
    # filesystem is read-only, no Linux capabilities are kept (it runs as an
    # unprivileged user and binds 8080), and nothing in it can gain more.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # Optional: a private ntfy server for the notifications, so the snapshots
  # and descriptions never sit on ntfy.sh. Off unless asked for:
  #
  #   docker compose --profile ntfy up -d
  #
  # Made for a tailnet. Like Blynky it is published on loopback only, and a
  # Tailscale Service gives it a name and a real certificate:
  # `tailscale serve --service=svc:blynky-ntfy --https=443 127.0.0.1:2586`.
  # NTFY_PUBLIC_URL in .env must be that address: the links in each
  # notification, the snapshot among them, are built from it, and the phone
  # opens them over Tailscale. Blynky itself publishes over the compose
  # network, with NTFY_URL=http://ntfy/<topic>. See "Running your own ntfy
  # server" in docs/guide.md.
  ntfy:
    # Pinned by digest too, so the tag cannot be moved under it; Dependabot
    # proposes updates.
    image: binwiederhier/ntfy:v2.33.1@sha256:29bc952294d58957f6ca6638eca9a653a33555989224edbdf4bb9433ee606497
    profiles: [ntfy]
    command: serve
    restart: unless-stopped
    ports:
      - "${NTFY_BIND_ADDR:-127.0.0.1}:${NTFY_HOST_PORT:-2586}:80"
    environment:
      # Left empty, ntfy refuses to start: attachments need it.
      NTFY_BASE_URL: ${NTFY_PUBLIC_URL:-}
      # Apple only lets ntfy.sh wake the iOS app. This server hands it a
      # message ID and a hash of the topic, never the message, and the app
      # then fetches the message from here. Android does not need it.
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      # Blynky sends each snapshot as an attachment, which ntfy refuses
      # without somewhere to keep it.
      NTFY_ATTACHMENT_CACHE_DIR: /var/cache/ntfy/attachments
      # tailscale serve passes the phone's address on in X-Forwarded-For.
      NTFY_BEHIND_PROXY: "true"
      TZ: ${TZ:-UTC}
    # The message cache and attachments; both expire on their own (12 hours
    # and 3 hours by default), so this stays small.
    volumes:
      - ./ntfy:/var/cache/ntfy
    # As for Blynky: ntfy writes only to its cache, and binds port 80 inside
    # the container, which Docker allows without NET_BIND_SERVICE.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
