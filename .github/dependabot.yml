# Weekly proposals for what Blynky is built from: the Actions in .github/
# workflows (pinned by commit), the base images in the Dockerfile and the ntfy
# image in docker-compose.yml (pinned by digest).
#
# Python packages are left out: uv.lock resolves blinkpy from ../blinkpy, a
# sibling checkout Dependabot does not have, so it cannot re-lock. Update them
# by hand with `uv lock --upgrade` from a development setup (CONTRIBUTING.md).

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # New digests only, for the same Python. The Dockerfile builds the virtual
  # environment on the uv image and runs it on the python image, so the two
  # must carry the same Python version: a bump to one alone ships an image
  # whose venv points at an interpreter it was not built for, and cannot
  # import anything. Moving to a new Python is a change to both FROM lines
  # together, by hand.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: ghcr.io/astral-sh/uv
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
