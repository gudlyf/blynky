# Publishes the image to ghcr.io/gudlyf/blynky for every version tag, so
# docker compose can pull it instead of building:
#
#   git tag -a v0.4.1 -m v0.4.1 <commit> && git push origin v0.4.1
#
# gives 0.4.1, 0.4 and latest. Running it by hand from the Actions tab on main
# gives edge instead, to try main before tagging it. A pull request that
# touches the image builds both architectures and publishes nothing.
#
# Each architecture builds on a runner of its own kind rather than under
# emulation, which is far faster for the arm64 one; the last job joins the two
# into one multi-arch image. amd64 and arm64 are all there is: the uv base
# image the build stage uses comes in no other.
#
# Free for a public repository: the runners, the cache and ghcr.io storage and
# pulls. The first image published is private; make the package public once,
# in its settings on GitHub, and every later one is too.
#
# Actions are pinned by commit, with the release beside it, so a moved tag
# cannot change what runs with a token that can write packages.

name: Docker image

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      # .git comes along: the Dockerfile's version stage records the commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      # Pushed by digest alone; the tags go on in the merge job, once both
      # architectures are there to put them on.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Record the digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          MATRIX_PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"
          echo "PLATFORM_PAIR=${MATRIX_PLATFORM//\//-}" >> "$GITHUB_ENV"
        shell: bash

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v0.4.1 gives 0.4.1, 0.4 and latest; a run on main, edge. No bare
      # major tag while it is 0.x, where a minor can break things.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main

      # The description shows on the package page; for a multi-arch image
      # ghcr.io reads it from the index, not the labels.
      - name: Tag the multi-arch image
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digests=()
          for digest in *; do digests+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.description=A self-hosted live view and searchable archive for Blink cameras, with motion clips described by a local vision model." \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            "${digests[@]}"
        shell: bash

      - name: Inspect
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
