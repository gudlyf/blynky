[project]
name = "blynky"
version = "0.1.0"
description = "A self-hosted live view and searchable archive for Blink cameras, with motion clips described by a local vision model."
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "blinkpy",
    "aiohttp>=3.9",
    "aiofiles>=23.0",
    "python-slugify>=8.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["ruff>=0.16"]

# The OAuth v2 flow this depends on is only in the local checkout, not on PyPI.
[tool.uv.sources]
blinkpy = { path = "../blinkpy" }

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"run.py" = ["D100"]
