[project]
name = "blynky"
version = "0.1.1"
description = "A self-hosted live view and searchable archive for Blink cameras, with motion clips described by a local vision model."
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "blinkpy",
    "aiohttp>=3.14.5",
    "aiofiles>=25.1.0",
    "python-slugify>=9.1.3",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["ruff>=0.17.2"]

# blinkpy is a local checkout pinned to a commit that includes fixes not yet on PyPI.
[tool.uv.sources]
blinkpy = { path = "../blinkpy" }

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"run.py" = ["D100"]
