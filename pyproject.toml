[project]
name = "blynky"
version = "0.4.1"
description = "A self-hosted live view and searchable archive for Blink cameras, with motion clips described by a local vision model."
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "blinkpy",
    "aiohttp>=3.14.5",
    "aiofiles>=25.1.0",
    "python-slugify>=9.1.3",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["ruff>=0.17.2", "pytest>=8.4", "pytest-aiohttp>=1.1"]

# blinkpy is a local checkout pinned to a commit that includes fixes not yet on PyPI.
[tool.uv.sources]
blinkpy = { path = "../blinkpy" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::aiohttp.web_exceptions.NotAppKeyWarning"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"run.py" = ["D100"]
# A test's name says what it checks.
"tests/*" = ["D100", "D103"]
